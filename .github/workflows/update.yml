name: 每日自动更新看板

on:
  # 每天 18:30（北京时间）自动更新一次。cron 写 UTC，北京 = UTC+8，故 10:30 UTC。
  #
  # 【关于原作者为何停用、而这里可以开启】
  # 原作者在 2026-09-18 关掉了云端定时任务，原因是「本机 + 云端双写」互相覆盖：
  #   1) 云端 checkout 仓库里的 template.html 重建 index.html，会覆盖本机用新版模板推出的完整版；
  #   2) 云端不推 version.txt，前端版本探针读到旧版本号 → 误判「已是最新」，问题被锁死。
  # 本仓库是「云端单写」：没有任何本机计划任务往这里推，template.html 与 index.html
  # 始终由同一次构建产出，因此不存在上述冲突。
  # 另：Action 的提交已包含 version.txt，版本探针能正常推进。
  schedule:
    - cron: '30 10 * * *'   # 18:30 北京 每天一次
  workflow_dispatch:   # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        # 与 requirements.txt 保持一致；pandas 3.x 有破坏性变更（见 rotation README 附录），锁 <3。
        run: pip install "requests<3" "numpy<3" "pandas<3" "akshare<2"

      # 【2026-11-01 移除 actions/cache】原做法是 path: cache + 固定 key "etf-cache-v2"。
      # actions/cache 的 key 是**不可变**的：首次写入后再也不会更新，日志里一直是
      #   `Cache hit occurred on the primary key etf-cache-v2, not saving cache.`
      # 于是它每次恢复的都是同一份 10 月底的旧快照，运行期间写进 cache/ 的新内容
      # 在任务结束时全部丢弃；更糟的是 tar 解包发生在 checkout 之后，旧快照会盖掉
      # 仓库里更新的同名文件。实测 cache/ 下的文件（csi*/tc_*/wind*/tc_000985_ohlc 等）
      # 全部已纳入 git 跟踪并随每次运行提交 ⇒ 缓存层零收益、只有回退风险，直接删掉。
      - name: 保证 cache 目录存在
        run: mkdir -p cache

      - name: 抓取数据
        id: fetch
        # 关键：data.json 的 updated 字段由本步骤写入（datetime.now()），
        # runner 默认 UTC，不设这时区会让页面顶部「数据更新」和 version.txt
        # 都显示比北京时间早 8 小时的值。
        env:
          TZ: Asia/Shanghai
        run: |
          # 缓存全部来自 git checkout（cache/ 已全量纳入版本库），这里只做数量体检
          CSI_COUNT=$(find cache -maxdepth 1 -name "csi*.csv" 2>/dev/null | wc -l)
          echo "cache 中 csi*.csv 数量: $CSI_COUNT"

          if [ "$CSI_COUNT" -ge 15 ]; then
            echo "=== 日常增量模式 ==="
            python fetch_data.py --quick
          elif [ "$CSI_COUNT" -ge 3 ]; then
            echo "=== 准冷启动（缓存部分可用，全量但有断点续跑） ==="
            python fetch_data.py
          else
            echo "=== 完整冷启动（缓存不足，全量回填） ==="
            python fetch_data.py
          fi
        timeout-minutes: 15

      - name: 构建页面
        # runner 默认 UTC，会让 version.txt 和「打包于」时间戳比北京时间慢 8 小时
        env:
          TZ: Asia/Shanghai
        run: python build.py

      # 页面本体是 3.4MB 的自包含 HTML，数值全在 JS 变量里、图表是 canvas，
      # AI 的网页抓取器读不到任何一个数字。这里从 data.json 反推一份纯文本摘要
      # (llms.txt / snapshot.md / latest.json)，让任何大模型一次就能读完当日读数。
      - name: 生成 AI 可读摘要
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -f data.json ]; then
            python make_llm_summary.py
          else
            echo "data.json 缺失，跳过摘要生成"
            exit 0
          fi

      - name: 数据新鲜度告警（P0 · 2026-11-13）
        # 中证官网 WAF 曾让多张卡片连续多日「沿用旧缓存」而 workflow 仍 success、
        # 日志只有一行不起眼的跳过提示（用户看到的是「数据日期差原版好几天」）。
        # 主取数现已能经 /api/csindex 自愈，这里只做最后一道可见性兜底：
        # 落后 >=2 天或 >=8 张卡片同时滞后时打 ::warning::，绝不 fail 整轮
        #（节假日 / 披露滞后属正常，见 README 第十一部分维护须知）。
        # 摘要文件自带「数据滞后提示」段，无需在这里重复生成。
        env:
          TZ: Asia/Shanghai
        run: python3 check_freshness.py

      - name: 提交并推送
        run: |
          # 数据有效性守卫：关键产物必须存在、非空且 JSON 合法。
          # 不做「必须是今天」的判定：节假日 / 披露滞后属正常（见 README 维护须知）。
          for f in data.json latest.json index.html version.txt llms.txt; do
            test -s "$f" || { echo "::error::守卫失败：$f 缺失或为空"; exit 1; }
            case "$f" in *.json) python3 -m json.tool "$f" >/dev/null || { echo "::error::$f 不是合法 JSON"; exit 1; } ;; esac
          done
          echo "数据有效性守卫通过"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data.js 不再提交（= data.json 的副本，2.2MB/天纯冗余；build.py 需要时会现生成）
          git add index.html anchor_v2.html data.json version.txt cache/
          # AI 可读摘要（llms.txt 是 2024 年提出的约定文件名，部分工具会自动探测）
          git add llms.txt snapshot.md latest.json
          if git diff --staged --quiet; then
            echo "内容未变化，跳过提交。"
          else
            git commit -m "chore: 自动更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi